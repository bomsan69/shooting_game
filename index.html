<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Tactical Strike — Top-Down CS Web Game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    user-select: none;
  }
  #gameCanvas {
    display: block;
    background: #1b1b1b;
    cursor: crosshair;
  }
  #startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at center, #1a1d22 0%, #08090b 100%);
    color: #eee;
    z-index: 10;
  }
  #startScreen h1 {
    font-size: 42px;
    letter-spacing: 4px;
    margin: 0 0 6px;
    color: #e8e8e8;
  }
  #startScreen p.subtitle {
    color: #8a9099;
    margin: 0 0 34px;
    font-size: 14px;
  }
  .level-grid {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }
  .level-btn {
    width: 150px;
    padding: 16px 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 6px;
    color: #eee;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .level-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: #e0453f;
    transform: translateY(-2px);
  }
  .level-btn .lvl-num {
    font-size: 12px;
    color: #9aa0a8;
    letter-spacing: 1px;
  }
  .level-btn .lvl-name {
    font-size: 18px;
    font-weight: bold;
  }
  .level-btn .lvl-desc {
    font-size: 12px;
    color: #b7bcc3;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="startScreen">
  <h1>TACTICAL STRIKE</h1>
  <p class="subtitle">난이도를 선택하세요 — 선택한 레벨은 게임이 끝날 때까지 유지됩니다</p>
  <div class="level-grid">
    <button class="level-btn" data-level="0">
      <span class="lvl-num">LEVEL 1</span>
      <span class="lvl-name">RECRUIT</span>
      <span class="lvl-desc">봇 3마리 · 권총<br>가장 쉬움</span>
    </button>
    <button class="level-btn" data-level="1">
      <span class="lvl-num">LEVEL 2</span>
      <span class="lvl-name">EASY</span>
      <span class="lvl-desc">봇 4마리 · SMG<br>쉬움</span>
    </button>
    <button class="level-btn" data-level="2">
      <span class="lvl-num">LEVEL 3</span>
      <span class="lvl-name">NORMAL</span>
      <span class="lvl-desc">봇 5마리 · 라이플<br>기본 난이도</span>
    </button>
    <button class="level-btn" data-level="3">
      <span class="lvl-num">LEVEL 4</span>
      <span class="lvl-name">HARD</span>
      <span class="lvl-desc">봇 6마리 · 마크스맨<br>어려움</span>
    </button>
    <button class="level-btn" data-level="4">
      <span class="lvl-num">LEVEL 5</span>
      <span class="lvl-name">HELL</span>
      <span class="lvl-desc">봇 8마리 · LMG<br>가장 어려움</span>
    </button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // Phase 1: Core Engine Framework & Canvas Setup
  // ============================================================

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  // ---- Input Handling ----
  const Input = {
    keys: Object.create(null),
    mouseX: 0,
    mouseY: 0,
    mouseDown: false,
  };

  window.addEventListener("keydown", (e) => {
    Input.keys[e.code] = true;
  });
  window.addEventListener("keyup", (e) => {
    Input.keys[e.code] = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    Input.mouseX = e.clientX - rect.left;
    Input.mouseY = e.clientY - rect.top;
  });
  canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0) Input.mouseDown = true;
  });
  window.addEventListener("mouseup", (e) => {
    if (e.button === 0) Input.mouseDown = false;
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---- Math Utils ----
  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }
  function dist(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function angleLerp(a, b, t) {
    let diff = b - a;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return a + diff * t;
  }

  // ============================================================
  // Phase 2: Map Geometry, Collisions & Raycasting Engine
  // ============================================================
  const WORLD_W = 2200;
  const WORLD_H = 1400;

  // Wall/obstacle AABB colliders. type only affects rendering color.
  const walls = [
    // outer boundary
    { x: 0, y: 0, w: WORLD_W, h: 40, type: "concrete" },
    { x: 0, y: WORLD_H - 40, w: WORLD_W, h: 40, type: "concrete" },
    { x: 0, y: 0, w: 40, h: WORLD_H, type: "concrete" },
    { x: WORLD_W - 40, y: 0, w: 40, h: WORLD_H, type: "concrete" },
    // mid chokepoint band (gap at x:1050-1150 is the passable doorway)
    { x: 700, y: 660, w: 350, h: 50, type: "concrete" },
    { x: 1150, y: 660, w: 350, h: 50, type: "concrete" },
    // structural barriers
    { x: 300, y: 380, w: 220, h: 40, type: "concrete" },
    { x: 1680, y: 980, w: 40, h: 220, type: "concrete" },
    // cover crates (wood/concrete)
    { x: 230, y: 200, w: 70, h: 70, type: "wood" },
    { x: 470, y: 150, w: 100, h: 50, type: "concrete" },
    { x: 150, y: 600, w: 70, h: 70, type: "wood" },
    { x: 1720, y: 1080, w: 70, h: 70, type: "wood" },
    { x: 1880, y: 1200, w: 100, h: 50, type: "concrete" },
    { x: 1950, y: 850, w: 70, h: 70, type: "wood" },
    { x: 1080, y: 820, w: 60, h: 110, type: "concrete" },
    { x: 1060, y: 480, w: 60, h: 110, type: "concrete" },
    { x: 650, y: 900, w: 80, h: 80, type: "wood" },
    { x: 1450, y: 400, w: 80, h: 80, type: "wood" },
    { x: 400, y: 1100, w: 90, h: 60, type: "concrete" },
    { x: 1750, y: 250, w: 90, h: 60, type: "wood" },
  ];

  // Bombsite zones: purely cosmetic tint regions, not colliders.
  const zones = [
    { x: 100, y: 80, w: 520, h: 420, label: "A", color: "rgba(255,90,90,0.07)", edge: "rgba(255,90,90,0.35)" },
    { x: 1550, y: 900, w: 520, h: 420, label: "B", color: "rgba(90,150,255,0.07)", edge: "rgba(90,150,255,0.35)" },
  ];

  // ---- Spatial partition grid for wall broad-phase queries ----
  const GRID_CELL = 150;
  const wallGrid = new Map();
  (function buildWallGrid() {
    walls.forEach((w, idx) => {
      const cx0 = Math.floor(w.x / GRID_CELL);
      const cy0 = Math.floor(w.y / GRID_CELL);
      const cx1 = Math.floor((w.x + w.w) / GRID_CELL);
      const cy1 = Math.floor((w.y + w.h) / GRID_CELL);
      for (let cx = cx0; cx <= cx1; cx++) {
        for (let cy = cy0; cy <= cy1; cy++) {
          const key = cx + "," + cy;
          if (!wallGrid.has(key)) wallGrid.set(key, []);
          wallGrid.get(key).push(idx);
        }
      }
    });
  })();

  function queryNearbyWalls(x, y, radius) {
    const cx0 = Math.floor((x - radius) / GRID_CELL);
    const cy0 = Math.floor((y - radius) / GRID_CELL);
    const cx1 = Math.floor((x + radius) / GRID_CELL);
    const cy1 = Math.floor((y + radius) / GRID_CELL);
    const seen = new Set();
    const result = [];
    for (let cx = cx0; cx <= cx1; cx++) {
      for (let cy = cy0; cy <= cy1; cy++) {
        const arr = wallGrid.get(cx + "," + cy);
        if (!arr) continue;
        for (const idx of arr) {
          if (!seen.has(idx)) {
            seen.add(idx);
            result.push(walls[idx]);
          }
        }
      }
    }
    return result;
  }

  // ---- Circle vs AABB slide-collision resolution ----
  function resolveCircleRect(entity, rect) {
    const withinX = entity.x > rect.x && entity.x < rect.x + rect.w;
    const withinY = entity.y > rect.y && entity.y < rect.y + rect.h;

    if (withinX && withinY) {
      // Entity center is inside the rect: push out along the shallowest axis.
      const left = entity.x - rect.x;
      const right = rect.x + rect.w - entity.x;
      const top = entity.y - rect.y;
      const bottom = rect.y + rect.h - entity.y;
      const minPen = Math.min(left, right, top, bottom);
      if (minPen === left) entity.x = rect.x - entity.radius;
      else if (minPen === right) entity.x = rect.x + rect.w + entity.radius;
      else if (minPen === top) entity.y = rect.y - entity.radius;
      else entity.y = rect.y + rect.h + entity.radius;
      return;
    }

    const closestX = clamp(entity.x, rect.x, rect.x + rect.w);
    const closestY = clamp(entity.y, rect.y, rect.y + rect.h);
    const dx = entity.x - closestX;
    const dy = entity.y - closestY;
    const distSq = dx * dx + dy * dy;
    const r = entity.radius;
    if (distSq < r * r) {
      const d = Math.sqrt(distSq) || 0.0001;
      const overlap = r - d;
      const nx = dx / d, ny = dy / d;
      entity.x += nx * overlap;
      entity.y += ny * overlap;
      if (entity.vx !== undefined) {
        const vDotN = entity.vx * nx + entity.vy * ny;
        if (vDotN < 0) {
          entity.vx -= vDotN * nx;
          entity.vy -= vDotN * ny;
        }
      }
    }
  }

  function resolveWallCollisions(entity) {
    const nearby = queryNearbyWalls(entity.x, entity.y, entity.radius + 40);
    for (const rect of nearby) resolveCircleRect(entity, rect);
  }

  // ---- Segment vs AABB intersection (Liang-Barsky), used for raycasting ----
  function segmentIntersectsRect(x0, y0, x1, y1, rect) {
    const dx = x1 - x0, dy = y1 - y0;
    const p = [-dx, dx, -dy, dy];
    const q = [x0 - rect.x, rect.x + rect.w - x0, y0 - rect.y, rect.y + rect.h - y0];
    let t0 = 0, t1 = 1;
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) {
        if (q[i] < 0) return false;
      } else {
        const r = q[i] / p[i];
        if (p[i] < 0) {
          if (r > t1) return false;
          if (r > t0) t0 = r;
        } else {
          if (r < t0) return false;
          if (r < t1) t1 = r;
        }
      }
    }
    return true;
  }

  // Returns true if the line of sight between two points is unobstructed by walls.
  function raycastClear(x0, y0, x1, y1, wallList) {
    const list = wallList || walls;
    for (const w of list) {
      if (segmentIntersectsRect(x0, y0, x1, y1, w)) return false;
    }
    return true;
  }

  // ---- Camera (follows player, clamped to world bounds) ----
  const camera = { x: 0, y: 0 };
  function updateCamera() {
    camera.x = clamp(Player.x - canvas.width / 2, 0, Math.max(0, WORLD_W - canvas.width));
    camera.y = clamp(Player.y - canvas.height / 2, 0, Math.max(0, WORLD_H - canvas.height));
  }

  // ============================================================
  // Player Entity (movement + mouse aim)
  // ============================================================
  const Player = {
    name: "Player",
    x: 1100,
    y: 1250,
    vx: 0,
    vy: 0,
    angle: 0,
    radius: 16,
    maxSpeed: 260,        // px/sec
    accel: 1800,          // px/sec^2
    friction: 1400,       // px/sec^2
    // Combat state (Phase 4)
    alive: true,
    respawnTimer: 0,
    maxHp: 100,
    hp: 100,
    maxArmor: 100,
    armor: 100,
    // Weapon state (Phase 3)
    ammo: 30,
    reserve: 90,
    reloading: false,
    reloadTimer: 0,
    fireTimer: 0,
    spread: 0.01,
    muzzleFlashTimer: 0,
  };

  function updatePlayer(dt) {
    if (!Player.alive) {
      Player.respawnTimer -= dt;
      if (Player.respawnTimer <= 0) respawnPlayer();
      return;
    }

    let mx = 0, my = 0;
    if (Input.keys["KeyW"]) my -= 1;
    if (Input.keys["KeyS"]) my += 1;
    if (Input.keys["KeyA"]) mx -= 1;
    if (Input.keys["KeyD"]) mx += 1;

    if (mx !== 0 || my !== 0) {
      const len = Math.sqrt(mx * mx + my * my);
      mx /= len; my /= len;
      Player.vx += mx * Player.accel * dt;
      Player.vy += my * Player.accel * dt;
    } else {
      // Friction: decelerate toward zero
      const speed = Math.sqrt(Player.vx * Player.vx + Player.vy * Player.vy);
      if (speed > 0) {
        const drop = Player.friction * dt;
        const newSpeed = Math.max(0, speed - drop);
        const scale = speed > 0 ? newSpeed / speed : 0;
        Player.vx *= scale;
        Player.vy *= scale;
      }
    }

    // Clamp to max speed
    const speed = Math.sqrt(Player.vx * Player.vx + Player.vy * Player.vy);
    if (speed > Player.maxSpeed) {
      const scale = Player.maxSpeed / speed;
      Player.vx *= scale;
      Player.vy *= scale;
    }

    Player.x += Player.vx * dt;
    Player.y += Player.vy * dt;

    // World bounds clamp, then resolve collisions against nearby walls/crates.
    Player.x = clamp(Player.x, Player.radius, WORLD_W - Player.radius);
    Player.y = clamp(Player.y, Player.radius, WORLD_H - Player.radius);
    resolveWallCollisions(Player);

    // Aim toward mouse cursor (converted to world space via camera offset)
    const mouseWorldX = Input.mouseX + camera.x;
    const mouseWorldY = Input.mouseY + camera.y;
    Player.angle = Math.atan2(mouseWorldY - Player.y, mouseWorldX - Player.x);
  }

  // ============================================================
  // Phase 3: Weapon Mechanics, Recoil & Ballistics System
  // ============================================================
  // One weapon per difficulty level (SPEC.md Section 5C). Selected in startGame().
  const WEAPON_TABLE = {
    PISTOL: {
      name: "PISTOL", magSize: 12, reserveMax: 72,
      fireCooldown: 0.35, reloadDuration: 1.6,
      bulletSpeed: 1700, bulletDamage: 34, bulletRange: 900,
      minSpread: 0.006, maxSpread: 0.05, spreadPerShot: 0.01, spreadRecoverRate: 5.0,
    },
    SMG: {
      name: "SMG", magSize: 25, reserveMax: 125,
      fireCooldown: 0.08, reloadDuration: 2.0,
      bulletSpeed: 1500, bulletDamage: 16, bulletRange: 800,
      minSpread: 0.015, maxSpread: 0.13, spreadPerShot: 0.02, spreadRecoverRate: 3.5,
    },
    RIFLE: {
      name: "RIFLE", magSize: 30, reserveMax: 90,
      fireCooldown: 0.1, reloadDuration: 2.5,   // ~600 RPM baseline
      bulletSpeed: 1600, bulletDamage: 26, bulletRange: 950,
      minSpread: 0.01, maxSpread: 0.16, spreadPerShot: 0.018, spreadRecoverRate: 3.0,
    },
    MARKSMAN: {
      name: "MARKSMAN", magSize: 20, reserveMax: 80,
      fireCooldown: 0.25, reloadDuration: 3.0,
      bulletSpeed: 1900, bulletDamage: 45, bulletRange: 1100,
      minSpread: 0.005, maxSpread: 0.09, spreadPerShot: 0.028, spreadRecoverRate: 4.0,
    },
    LMG: {
      name: "LMG", magSize: 50, reserveMax: 150,
      fireCooldown: 0.07, reloadDuration: 4.0,
      bulletSpeed: 1500, bulletDamage: 22, bulletRange: 900,
      minSpread: 0.02, maxSpread: 0.22, spreadPerShot: 0.015, spreadRecoverRate: 2.2,
    },
  };
  let WEAPON = WEAPON_TABLE.RIFLE;

  // ---- Object pool: Bullets ----
  const MAX_BULLETS = 400;
  const bullets = [];
  for (let i = 0; i < MAX_BULLETS; i++) {
    bullets.push({
      active: false, x: 0, y: 0, prevX: 0, prevY: 0, vx: 0, vy: 0,
      damage: 0, owner: null, traveled: 0, maxRange: 0, radius: 3,
    });
  }
  let bulletCursor = 0;
  function spawnBullet(x, y, angle, speed, damage, maxRange, owner) {
    for (let n = 0; n < MAX_BULLETS; n++) {
      const idx = (bulletCursor + n) % MAX_BULLETS;
      const b = bullets[idx];
      if (!b.active) {
        b.active = true;
        b.x = x; b.y = y; b.prevX = x; b.prevY = y;
        b.vx = Math.cos(angle) * speed;
        b.vy = Math.sin(angle) * speed;
        b.damage = damage; b.owner = owner; b.traveled = 0; b.maxRange = maxRange;
        bulletCursor = (idx + 1) % MAX_BULLETS;
        return b;
      }
    }
    return null; // pool exhausted; drop the shot rather than allocate
  }

  // ---- Object pool: Impact / muzzle / casing particles ----
  const MAX_PARTICLES = 300;
  const particles = [];
  for (let i = 0; i < MAX_PARTICLES; i++) {
    particles.push({
      active: false, type: "spark", x: 0, y: 0, vx: 0, vy: 0,
      life: 0, maxLife: 0, color: "#fff", size: 2,
    });
  }
  let particleCursor = 0;
  function spawnParticle(type, x, y, vx, vy, life, color, size) {
    for (let n = 0; n < MAX_PARTICLES; n++) {
      const idx = (particleCursor + n) % MAX_PARTICLES;
      const p = particles[idx];
      if (!p.active) {
        p.active = true; p.type = type; p.x = x; p.y = y;
        p.vx = vx; p.vy = vy; p.life = life; p.maxLife = life;
        p.color = color; p.size = size;
        particleCursor = (idx + 1) % MAX_PARTICLES;
        return;
      }
    }
  }

  function spawnImpactSparks(x, y, impactAngle) {
    const sparkCount = 6;
    for (let i = 0; i < sparkCount; i++) {
      const a = impactAngle + Math.PI + (Math.random() * 1.2 - 0.6);
      const spd = 120 + Math.random() * 180;
      spawnParticle("spark", x, y, Math.cos(a) * spd, Math.sin(a) * spd,
        0.25 + Math.random() * 0.15, "#ffcf80", 2 + Math.random() * 2);
    }
  }

  function updateParticles(dt) {
    for (const p of particles) {
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.type === "casing") {
        p.vy += 260 * dt; // gravity-ish arc for ejected shells
        p.vx *= (1 - Math.min(1, 3 * dt));
      } else {
        p.vx *= (1 - Math.min(1, 4 * dt));
        p.vy *= (1 - Math.min(1, 4 * dt));
      }
    }
  }

  // Sweeps each active bullet against walls (Liang-Barsky segment test via the
  // spatial grid) and, once entities exist (Phase 4), against their hitboxes.
  function updateBullets(dt) {
    for (const b of bullets) {
      if (!b.active) continue;
      b.prevX = b.x; b.prevY = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      const stepDist = dist(b.prevX, b.prevY, b.x, b.y);
      b.traveled += stepDist;

      const hitEntity = checkBulletEntityHit(b);
      if (hitEntity) {
        b.active = false;
        continue;
      }

      const midX = (b.x + b.prevX) / 2, midY = (b.y + b.prevY) / 2;
      const nearbyWalls = queryNearbyWalls(midX, midY, stepDist / 2 + 40);
      let hitWall = false;
      for (const w of nearbyWalls) {
        if (segmentIntersectsRect(b.prevX, b.prevY, b.x, b.y, w)) { hitWall = true; break; }
      }
      if (hitWall) {
        spawnImpactSparks(b.x, b.y, Math.atan2(b.vy, b.vx));
        b.active = false;
        continue;
      }

      if (b.traveled >= b.maxRange || b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) {
        b.active = false;
      }
    }
  }

  // Real hit detection against bots/player, wired up in Phase 4.
  function checkBulletEntityHit(b) {
    if (b.owner === Player) {
      for (const bot of bots) {
        if (bot.alive && tryHitEntity(b, bot, false)) return true;
      }
    } else if (Player.alive) {
      if (tryHitEntity(b, Player, true)) return true;
    }
    return false;
  }

  function firePlayerWeapon() {
    Player.ammo--;
    const spreadOffset = (Math.random() * 2 - 1) * Player.spread;
    const angle = Player.angle + spreadOffset;
    const muzzleDist = Player.radius + 6;
    const bx = Player.x + Math.cos(Player.angle) * muzzleDist;
    const by = Player.y + Math.sin(Player.angle) * muzzleDist;

    spawnBullet(bx, by, angle, WEAPON.bulletSpeed, WEAPON.bulletDamage, WEAPON.bulletRange, Player);
    lastShotSound.x = Player.x; lastShotSound.y = Player.y; lastShotSound.t = gameTime;

    Player.muzzleFlashTimer = 0.04;
    spawnParticle("flash", bx, by, Math.cos(Player.angle) * 40, Math.sin(Player.angle) * 40,
      0.05, "#ffdd66", 10);

    const ejectAngle = Player.angle + Math.PI / 2 + (Math.random() * 0.4 - 0.2);
    spawnParticle("casing", Player.x, Player.y, Math.cos(ejectAngle) * 90, Math.sin(ejectAngle) * 90 - 40,
      0.6, "#d9c14a", 4);
  }

  function updateWeapon(dt) {
    if (!Player.alive) return;

    // Reload trigger (only starts if not already reloading and something to gain)
    if (Input.keys["KeyR"] && !Player.reloading && Player.ammo < WEAPON.magSize && Player.reserve > 0) {
      Player.reloading = true;
      Player.reloadTimer = WEAPON.reloadDuration;
    }

    if (Player.reloading) {
      Player.reloadTimer -= dt;
      if (Player.reloadTimer <= 0) {
        const needed = WEAPON.magSize - Player.ammo;
        const take = Math.min(needed, Player.reserve);
        Player.ammo += take;
        Player.reserve -= take;
        Player.reloading = false;
        Player.reloadTimer = 0;
      }
    }

    Player.fireTimer = Math.max(0, Player.fireTimer - dt);

    let firedThisFrame = false;
    if (Input.mouseDown && !Player.reloading && Player.fireTimer <= 0 && Player.ammo > 0) {
      firePlayerWeapon();
      firedThisFrame = true;
      Player.fireTimer = WEAPON.fireCooldown;
    }

    if (firedThisFrame) {
      Player.spread = Math.min(WEAPON.maxSpread, Player.spread + WEAPON.spreadPerShot);
    } else {
      Player.spread = WEAPON.minSpread + (Player.spread - WEAPON.minSpread) * Math.exp(-WEAPON.spreadRecoverRate * dt);
      if (Player.spread < WEAPON.minSpread + 0.0005) Player.spread = WEAPON.minSpread;
    }

    Player.muzzleFlashTimer = Math.max(0, Player.muzzleFlashTimer - dt);
  }

  // ============================================================
  // Phase 4: Enemy AI Bot Patrol, Line-of-Sight & Combat System
  // ============================================================
  const BOT_SOUND_RADIUS = 450;   // gunshot audibility radius (unscaled by level)
  const BOT_PREFERRED_MIN = 220;  // preferred combat distance (unscaled by level)
  const BOT_PREFERRED_MAX = 420;

  // Difficulty-scaled bot combat stats (SPEC.md Section 5B). Set by startGame().
  let BOT_DETECT_RANGE = 650;
  let BOT_FOV_HALF = 1.15;        // ~66 degree half-angle vision cone
  let BOT_DAMAGE = 16;
  let BOT_FIRE_SPREAD = 0.05;
  let BOT_BURST_COOLDOWN = 0.13;
  let BOT_BURST_MIN = 3;
  let BOT_BURST_MAX = 4;
  let BOT_PAUSE_MIN = 0.9;
  let BOT_PAUSE_MAX = 1.4;
  let BOT_PERSISTENCE = 3.0;      // seconds of lost LOS tolerated before dropping to ALERT
  let BOT_ALERT_DURATION = 4.0;   // seconds a bot investigates a sound/last-seen position

  // Level 1 (Recruit) -> Level 5 (Hell). Index matches the start-screen buttons.
  const LEVEL_CONFIGS = [
    {
      name: "RECRUIT", weaponKey: "PISTOL", botCount: 3,
      detectRange: 450, fovHalf: 0.80, chaseSpeed: 130, armor: 0,
      damage: 10, fireSpread: 0.11, burstCooldown: 0.22, burstMin: 2, burstMax: 3,
      pauseMin: 1.3, pauseMax: 1.8, persistence: 1.5, alertDuration: 2.5,
    },
    {
      name: "EASY", weaponKey: "SMG", botCount: 4,
      detectRange: 520, fovHalf: 0.95, chaseSpeed: 145, armor: 0,
      damage: 12, fireSpread: 0.08, burstCooldown: 0.18, burstMin: 3, burstMax: 3,
      pauseMin: 1.1, pauseMax: 1.6, persistence: 2.0, alertDuration: 3.0,
    },
    {
      name: "NORMAL", weaponKey: "RIFLE", botCount: 5,
      detectRange: 650, fovHalf: 1.15, chaseSpeed: 160, armor: 0,
      damage: 16, fireSpread: 0.05, burstCooldown: 0.13, burstMin: 3, burstMax: 4,
      pauseMin: 0.9, pauseMax: 1.4, persistence: 3.0, alertDuration: 4.0,
    },
    {
      name: "HARD", weaponKey: "MARKSMAN", botCount: 6,
      detectRange: 720, fovHalf: 1.30, chaseSpeed: 185, armor: 25,
      damage: 20, fireSpread: 0.035, burstCooldown: 0.10, burstMin: 4, burstMax: 5,
      pauseMin: 0.7, pauseMax: 1.1, persistence: 3.5, alertDuration: 4.5,
    },
    {
      name: "HELL", weaponKey: "LMG", botCount: 8,
      detectRange: 800, fovHalf: 1.45, chaseSpeed: 205, armor: 50,
      damage: 24, fireSpread: 0.02, burstCooldown: 0.08, burstMin: 5, burstMax: 6,
      pauseMin: 0.5, pauseMax: 0.9, persistence: 4.0, alertDuration: 5.0,
    },
  ];

  let gameTime = 0;
  const lastShotSound = { x: 0, y: 0, t: -999 };
  const killFeed = [];
  function pushKillFeed(attacker, victim, headshot) {
    killFeed.push({ attacker, victim, headshot, time: gameTime });
    if (killFeed.length > 20) killFeed.shift();
  }

  function applyDamage(entity, rawDamage, isHeadshot) {
    let dmg = isHeadshot ? rawDamage * 3 : rawDamage;
    if (entity.armor > 0) {
      const absorbed = Math.min(entity.armor, dmg * 0.5);
      entity.armor -= absorbed;
      dmg -= absorbed;
    }
    entity.hp = Math.max(0, entity.hp - dmg);
  }

  function segmentClosestPoint(x0, y0, x1, y1, px, py) {
    const dx = x1 - x0, dy = y1 - y0;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq > 0 ? ((px - x0) * dx + (py - y0) * dy) / lenSq : 0;
    t = clamp(t, 0, 1);
    return { x: x0 + dx * t, y: y0 + dy * t };
  }

  function withinFOV(fromAngle, toDx, toDy, halfFov) {
    const targetAngle = Math.atan2(toDy, toDx);
    let diff = targetAngle - fromAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    return Math.abs(diff) <= halfFov;
  }

  // Headshot zone = small circle offset toward the entity's facing direction,
  // approximating the "top center" hitbox called out in SPEC.md.
  function tryHitEntity(b, entity, isPlayerTarget) {
    const cp = segmentClosestPoint(b.prevX, b.prevY, b.x, b.y, entity.x, entity.y);
    const dx = entity.x - cp.x, dy = entity.y - cp.y;
    const rr = entity.radius + b.radius;
    if (dx * dx + dy * dy > rr * rr) return false;

    const headR = entity.radius * 0.4;
    const hcx = entity.x + Math.cos(entity.angle) * entity.radius * 0.5;
    const hcy = entity.y + Math.sin(entity.angle) * entity.radius * 0.5;
    const hdx = hcx - cp.x, hdy = hcy - cp.y;
    const headRR = (headR + b.radius) * (headR + b.radius);
    const isHeadshot = (hdx * hdx + hdy * hdy) <= headRR;

    applyDamage(entity, b.damage, isHeadshot);
    spawnImpactSparks(cp.x, cp.y, Math.atan2(b.vy, b.vx));

    if (entity.hp <= 0) handleDeath(entity, isPlayerTarget, b.owner, isHeadshot);
    return true;
  }

  function handleDeath(entity, isPlayerTarget, attacker, isHeadshot) {
    const attackerName = attacker.name;
    if (isPlayerTarget) {
      Player.alive = false;
      Player.respawnTimer = 3;
    } else {
      entity.alive = false;
      entity.state = "DEAD";
      entity.respawnTimer = 5;
    }
    const victimName = isPlayerTarget ? "Player" : entity.name;
    pushKillFeed(attackerName, victimName, isHeadshot);
  }

  function respawnPlayer() {
    Player.alive = true;
    Player.hp = Player.maxHp;
    Player.armor = Player.maxArmor;
    Player.x = 1100; Player.y = 1250;
    Player.vx = 0; Player.vy = 0;
    Player.ammo = WEAPON.magSize;
    Player.reserve = WEAPON.reserveMax;
    Player.reloading = false;
    Player.reloadTimer = 0;
    Player.spread = WEAPON.minSpread;
  }

  // ---- Ammo pickup crates (SPEC.md Section 6B) ----
  const AMMO_PICKUP_CONFIG = [
    { x: 950, y: 610 },
    { x: 1300, y: 790 },
    { x: 900, y: 1150 },
    { x: 550, y: 950 },
    { x: 1850, y: 700 },
  ];
  const AMMO_PICKUP_RADIUS = 14;
  const AMMO_PICKUP_RESPAWN = 20; // seconds
  let ammoPickups = AMMO_PICKUP_CONFIG.map((p) => ({ x: p.x, y: p.y, active: true, cooldown: 0 }));

  function updateAmmoPickups(dt) {
    for (const p of ammoPickups) {
      if (!p.active) {
        p.cooldown -= dt;
        if (p.cooldown <= 0) p.active = true;
        continue;
      }
      if (!Player.alive || Player.reserve >= WEAPON.reserveMax) continue;
      if (dist(Player.x, Player.y, p.x, p.y) <= Player.radius + AMMO_PICKUP_RADIUS) {
        Player.reserve = WEAPON.reserveMax;
        p.active = false;
        p.cooldown = AMMO_PICKUP_RESPAWN;
      }
    }
  }

  function respawnBot(bot) {
    bot.alive = true;
    bot.hp = bot.maxHp;
    bot.armor = bot.baseArmor;
    bot.x = bot.waypoints[0].x;
    bot.y = bot.waypoints[0].y;
    bot.vx = 0; bot.vy = 0;
    bot.state = "PATROL";
    bot.waypointIndex = 0;
    bot.loseSightTimer = 0;
    bot.burstShotsLeft = 0;
    bot.burstPause = 0;
    bot.fireCooldown = 0;
  }

  // 8 patrol routes total; a level uses the first N (see LEVEL_CONFIGS.botCount).
  const BOT_ROUTES = [
    [{ x: 180, y: 100 }, { x: 620, y: 100 }, { x: 620, y: 450 }, { x: 180, y: 450 }],
    [{ x: 150, y: 700 }, { x: 150, y: 1000 }, { x: 500, y: 1000 }, { x: 500, y: 700 }],
    [{ x: 950, y: 300 }, { x: 1300, y: 300 }, { x: 1300, y: 440 }, { x: 950, y: 440 }],
    [{ x: 1620, y: 950 }, { x: 2080, y: 950 }, { x: 2080, y: 1280 }, { x: 1620, y: 1280 }],
    [{ x: 1750, y: 350 }, { x: 2050, y: 350 }, { x: 2050, y: 600 }, { x: 1750, y: 600 }],
    [{ x: 950, y: 970 }, { x: 1300, y: 970 }, { x: 1300, y: 1110 }, { x: 950, y: 1110 }],
    [{ x: 550, y: 850 }, { x: 850, y: 850 }, { x: 850, y: 1050 }, { x: 550, y: 1050 }],
    [{ x: 1450, y: 750 }, { x: 1750, y: 750 }, { x: 1750, y: 950 }, { x: 1450, y: 950 }],
  ];

  function makeBot(id, waypoints, levelCfg) {
    return {
      id, name: "Bot" + (id + 1),
      x: waypoints[0].x, y: waypoints[0].y, vx: 0, vy: 0, angle: 0, radius: 16,
      hp: 100, maxHp: 100, armor: levelCfg.armor, maxArmor: 100, baseArmor: levelCfg.armor, alive: true,
      state: "PATROL", waypoints, waypointIndex: 0,
      patrolSpeed: Math.round(levelCfg.chaseSpeed * 0.65), chaseSpeed: levelCfg.chaseSpeed,
      alertTimer: 0, alertX: 0, alertY: 0,
      loseSightTimer: 0,
      fireCooldown: 0, burstShotsLeft: 0, burstPause: 0,
      respawnTimer: 0,
    };
  }
  let bots = [];

  function fireBotWeapon(bot) {
    const angle = bot.angle + (Math.random() * 2 - 1) * BOT_FIRE_SPREAD;
    const muzzleDist = bot.radius + 6;
    const bx = bot.x + Math.cos(bot.angle) * muzzleDist;
    const by = bot.y + Math.sin(bot.angle) * muzzleDist;
    spawnBullet(bx, by, angle, 1300, BOT_DAMAGE, 900, bot);
    spawnParticle("flash", bx, by, Math.cos(bot.angle) * 40, Math.sin(bot.angle) * 40, 0.05, "#ff9a5a", 8);
  }

  function updateBotAI(bot, dt) {
    const dxP = Player.x - bot.x, dyP = Player.y - bot.y;
    const distP = Math.sqrt(dxP * dxP + dyP * dyP);
    let canSee = false;
    if (Player.alive && distP < BOT_DETECT_RANGE && withinFOV(bot.angle, dxP, dyP, BOT_FOV_HALF)) {
      canSee = raycastClear(bot.x, bot.y, Player.x, Player.y);
    }

    if (canSee) {
      bot.state = "CHASE_ATTACK";
      bot.loseSightTimer = 0;
    } else if (bot.state === "CHASE_ATTACK") {
      bot.loseSightTimer += dt;
      if (bot.loseSightTimer > BOT_PERSISTENCE) {
        bot.state = "ALERT";
        bot.alertX = Player.x; bot.alertY = Player.y; bot.alertTimer = BOT_ALERT_DURATION;
      }
    } else if (bot.state === "ALERT") {
      bot.alertTimer -= dt;
      if (bot.alertTimer <= 0) bot.state = "PATROL";
    }

    if (bot.state === "PATROL" && Player.alive && gameTime - lastShotSound.t < 0.12) {
      const sd = dist(bot.x, bot.y, lastShotSound.x, lastShotSound.y);
      if (sd < BOT_SOUND_RADIUS) {
        bot.state = "ALERT";
        bot.alertX = lastShotSound.x; bot.alertY = lastShotSound.y; bot.alertTimer = BOT_ALERT_DURATION;
      }
    }

    if (bot.state === "PATROL") {
      const wp = bot.waypoints[bot.waypointIndex];
      const d = dist(bot.x, bot.y, wp.x, wp.y);
      if (d < 14) {
        bot.waypointIndex = (bot.waypointIndex + 1) % bot.waypoints.length;
      } else {
        const nx = (wp.x - bot.x) / d, ny = (wp.y - bot.y) / d;
        bot.vx = nx * bot.patrolSpeed; bot.vy = ny * bot.patrolSpeed;
        bot.angle = Math.atan2(ny, nx);
        bot.x += bot.vx * dt; bot.y += bot.vy * dt;
      }
    } else if (bot.state === "ALERT") {
      const d = dist(bot.x, bot.y, bot.alertX, bot.alertY);
      const targetAngle = Math.atan2(bot.alertY - bot.y, bot.alertX - bot.x);
      bot.angle = angleLerp(bot.angle, targetAngle, Math.min(1, dt * 6));
      if (d > 40) {
        bot.vx = Math.cos(bot.angle) * bot.patrolSpeed * 0.8;
        bot.vy = Math.sin(bot.angle) * bot.patrolSpeed * 0.8;
        bot.x += bot.vx * dt; bot.y += bot.vy * dt;
      } else {
        bot.vx = 0; bot.vy = 0;
      }
    } else if (bot.state === "CHASE_ATTACK") {
      bot.angle = Math.atan2(dyP, dxP);
      let moveX = 0, moveY = 0;
      if (distP > BOT_PREFERRED_MAX) {
        moveX = dxP / distP; moveY = dyP / distP;
      } else if (distP < BOT_PREFERRED_MIN) {
        moveX = -dxP / distP; moveY = -dyP / distP;
      } else {
        const strafeDir = Math.sin(bot.id * 1.7 + Math.floor(gameTime / 1.6)) >= 0 ? 1 : -1;
        moveX = (-dyP / distP) * strafeDir;
        moveY = (dxP / distP) * strafeDir;
      }
      bot.vx = moveX * bot.chaseSpeed;
      bot.vy = moveY * bot.chaseSpeed;
      bot.x += bot.vx * dt;
      bot.y += bot.vy * dt;

      bot.fireCooldown -= dt;
      bot.burstPause -= dt;
      if (canSee) {
        if (bot.burstShotsLeft > 0) {
          if (bot.fireCooldown <= 0) {
            fireBotWeapon(bot);
            bot.fireCooldown = BOT_BURST_COOLDOWN;
            bot.burstShotsLeft--;
            if (bot.burstShotsLeft === 0) bot.burstPause = BOT_PAUSE_MIN + Math.random() * (BOT_PAUSE_MAX - BOT_PAUSE_MIN);
          }
        } else if (bot.burstPause <= 0) {
          bot.burstShotsLeft = BOT_BURST_MIN + Math.floor(Math.random() * (BOT_BURST_MAX - BOT_BURST_MIN + 1));
        }
      }
    }
  }

  function resolveCircleCircle(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
    const minD = a.radius + b.radius;
    if (d < minD) {
      const overlap = (minD - d) / 2;
      const nx = dx / d, ny = dy / d;
      a.x -= nx * overlap; a.y -= ny * overlap;
      b.x += nx * overlap; b.y += ny * overlap;
    }
  }

  function updateBots(dt) {
    for (const bot of bots) {
      if (!bot.alive) {
        bot.respawnTimer -= dt;
        if (bot.respawnTimer <= 0) respawnBot(bot);
        continue;
      }
      updateBotAI(bot, dt);
      resolveWallCollisions(bot);
      bot.x = clamp(bot.x, bot.radius, WORLD_W - bot.radius);
      bot.y = clamp(bot.y, bot.radius, WORLD_H - bot.radius);
    }
    for (let i = 0; i < bots.length; i++) {
      if (!bots[i].alive) continue;
      for (let j = i + 1; j < bots.length; j++) {
        if (!bots[j].alive) continue;
        resolveCircleCircle(bots[i], bots[j]);
      }
      if (Player.alive) resolveCircleCircle(bots[i], Player);
    }
  }

  // ============================================================
  // Rendering
  // ============================================================
  function drawPlayer() {
    ctx.save();
    ctx.translate(Player.x, Player.y);
    ctx.rotate(Player.angle);

    // Body
    ctx.fillStyle = "#3fd67a";
    ctx.beginPath();
    ctx.arc(0, 0, Player.radius, 0, Math.PI * 2);
    ctx.fill();

    // Facing indicator (gun/nose)
    ctx.fillStyle = "#1b1b1b";
    ctx.fillRect(Player.radius - 4, -4, 16, 8);

    if (Player.muzzleFlashTimer > 0) {
      ctx.fillStyle = "rgba(255, 221, 102, 0.9)";
      ctx.beginPath();
      ctx.moveTo(Player.radius + 10, 0);
      ctx.lineTo(Player.radius + 24, -7);
      ctx.lineTo(Player.radius + 24, 7);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }

  function drawBullets() {
    ctx.strokeStyle = "#fff6c9";
    ctx.lineWidth = 2;
    for (const b of bullets) {
      if (!b.active) continue;
      ctx.beginPath();
      ctx.moveTo(b.prevX, b.prevY);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      if (!p.active) continue;
      const t = clamp(p.life / p.maxLife, 0, 1);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      if (p.type === "casing") {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * t + 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawBackground() {
    ctx.fillStyle = "#1b1b1b";
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);

    // Simple grid for spatial reference / FPS-friendly static pattern
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    const step = 64;
    for (let x = 0; x < WORLD_W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, WORLD_H);
      ctx.stroke();
    }
    for (let y = 0; y < WORLD_H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(WORLD_W, y);
      ctx.stroke();
    }
  }

  function drawZones() {
    ctx.font = "bold 42px sans-serif";
    ctx.textAlign = "center";
    for (const z of zones) {
      ctx.fillStyle = z.color;
      ctx.fillRect(z.x, z.y, z.w, z.h);
      ctx.strokeStyle = z.edge;
      ctx.lineWidth = 3;
      ctx.strokeRect(z.x, z.y, z.w, z.h);
      ctx.fillStyle = z.edge;
      ctx.fillText(z.label, z.x + z.w / 2, z.y + 60);
    }
    ctx.textAlign = "left";
  }

  function drawWalls() {
    for (const w of walls) {
      if (w.type === "wood") {
        ctx.fillStyle = "#8a5a34";
        ctx.strokeStyle = "#5c3b20";
      } else {
        ctx.fillStyle = "#6b6f76";
        ctx.strokeStyle = "#43464b";
      }
      ctx.lineWidth = 2;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeRect(w.x, w.y, w.w, w.h);
    }
  }

  function drawAmmoPickups() {
    for (const p of ammoPickups) {
      if (!p.active) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = "#5a7a3a";
      ctx.strokeStyle = "#3a5222";
      ctx.lineWidth = 2;
      ctx.fillRect(-12, -9, 24, 18);
      ctx.strokeRect(-12, -9, 24, 18);
      ctx.fillStyle = "#e8d24a";
      ctx.fillRect(-6, -4, 3, 8);
      ctx.fillRect(-1, -4, 3, 8);
      ctx.fillRect(4, -4, 3, 8);
      ctx.restore();
    }
  }

  function drawBots() {
    for (const bot of bots) {
      if (!bot.alive) continue;
      ctx.save();
      ctx.translate(bot.x, bot.y);
      ctx.rotate(bot.angle);
      ctx.fillStyle = bot.state === "CHASE_ATTACK" ? "#e0453f" : bot.state === "ALERT" ? "#e0b73f" : "#c74f9e";
      ctx.beginPath();
      ctx.arc(0, 0, bot.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#1b1b1b";
      ctx.fillRect(bot.radius - 4, -4, 14, 8);
      ctx.restore();
    }
  }

  // ============================================================
  // Phase 5: UI HUD, Kill Feed, Radar Minimap
  // ============================================================
  function hpBarColor(pct) {
    if (pct > 0.5) return "#4bd67a";
    if (pct > 0.25) return "#e0b73f";
    return "#e0453f";
  }

  function drawStatBar(x, y, w, h, pct, color, label, value) {
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamp(pct, 0, 1), h);
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = "#e8e8e8";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "left";
    ctx.fillText(label, x, y - 4);
    ctx.textAlign = "right";
    ctx.fillText(String(value), x + w - 4, y + h - 3);
    ctx.textAlign = "left";
  }

  // Bottom tactical HUD: HP, armor, ammo counter, reload progress.
  function drawHUD() {
    const w = canvas.width, h = canvas.height;
    const panelH = 92;

    ctx.fillStyle = "rgba(8,10,14,0.6)";
    ctx.fillRect(0, h - panelH, w, panelH);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, h - panelH);
    ctx.lineTo(w, h - panelH);
    ctx.stroke();

    const barX = 30, barW = 240, barH = 16;
    const hpY = h - panelH + 22;
    const armorY = hpY + 32;
    drawStatBar(barX, hpY, barW, barH, Player.hp / Player.maxHp, hpBarColor(Player.hp / Player.maxHp), "HP", Math.round(Player.hp));
    drawStatBar(barX, armorY, barW, barH, Player.armor / Player.maxArmor, "#3f7fe0", "ARMOR", Math.round(Player.armor));

    ctx.textAlign = "right";
    ctx.fillStyle = "#f2f2f2";
    ctx.font = "bold 30px monospace";
    ctx.fillText(Player.ammo + " / " + Player.reserve, w - 30, h - panelH + 42);
    ctx.font = "11px monospace";
    ctx.fillStyle = "#9aa0a8";
    ctx.fillText(WEAPON.name, w - 30, h - panelH + 58);
    ctx.textAlign = "left";

    if (!Player.reloading && Player.ammo === 0) {
      ctx.textAlign = "right";
      ctx.font = "bold 13px monospace";
      if (Player.reserve > 0) {
        ctx.fillStyle = "#e0b73f";
        ctx.fillText("RELOAD (R)", w - 30, h - panelH + 15);
      } else if (Math.sin(gameTime * 6) > 0) {
        ctx.fillStyle = "#ff4040";
        ctx.fillText("OUT OF AMMO", w - 30, h - panelH + 15);
      }
      ctx.textAlign = "left";
    }

    if (Player.reloading) {
      const rW = 180, rH = 10;
      const rX = w - 30 - rW, rY = h - panelH + 70;
      const pct = 1 - Player.reloadTimer / WEAPON.reloadDuration;
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(rX, rY, rW, rH);
      ctx.fillStyle = "#e0b73f";
      ctx.fillRect(rX, rY, rW * clamp(pct, 0, 1), rH);
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.strokeRect(rX, rY, rW, rH);
      ctx.fillStyle = "#e0b73f";
      ctx.font = "10px monospace";
      ctx.textAlign = "center";
      ctx.fillText("RELOADING", rX + rW / 2, rY - 3);
      ctx.textAlign = "left";
    }
  }

  // Top-right kill feed: fades out over 5s, headshots highlighted in red.
  function drawKillFeed() {
    const x = canvas.width - 20;
    let y = 218;
    ctx.font = "13px monospace";
    ctx.textAlign = "right";
    for (let i = 0; i < killFeed.length; i++) {
      const k = killFeed[killFeed.length - 1 - i];
      const age = gameTime - k.time;
      if (age > 5) continue;
      const alpha = age > 4 ? clamp(5 - age, 0, 1) : 1;
      const text = k.attacker + (k.headshot ? " \u{1F3AF} " : " ︻╦╤─ ") + k.victim;
      const tw = ctx.measureText(text).width;

      ctx.globalAlpha = alpha * 0.55;
      ctx.fillStyle = "#0f0f14";
      ctx.fillRect(x - tw - 16, y - 14, tw + 16, 20);

      ctx.globalAlpha = alpha;
      ctx.fillStyle = k.headshot ? "#ff5050" : "#e8e8e8";
      ctx.fillText(text, x - 8, y);
      y += 24;
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  // Top-right radar: world bounds, obstacles, player + vision cone, revealed enemies.
  function drawMinimap() {
    const mapW = 190, mapH = 190;
    const mx = canvas.width - mapW - 14, my = 14;
    const scaleX = mapW / WORLD_W, scaleY = mapH / WORLD_H;

    ctx.save();
    ctx.beginPath();
    ctx.rect(mx, my, mapW, mapH);
    ctx.clip();

    ctx.fillStyle = "rgba(10,12,16,0.75)";
    ctx.fillRect(mx, my, mapW, mapH);

    ctx.fillStyle = "rgba(120,120,130,0.9)";
    for (const wl of walls) {
      ctx.fillRect(mx + wl.x * scaleX, my + wl.y * scaleY, Math.max(1, wl.w * scaleX), Math.max(1, wl.h * scaleY));
    }

    // Revealed enemies only: bots the player has provoked into ALERT/CHASE_ATTACK.
    ctx.fillStyle = "#ff4d4d";
    for (const bot of bots) {
      if (!bot.alive || bot.state === "PATROL") continue;
      ctx.beginPath();
      ctx.arc(mx + bot.x * scaleX, my + bot.y * scaleY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    if (Player.alive) {
      const px = mx + Player.x * scaleX, py = my + Player.y * scaleY;
      ctx.fillStyle = "rgba(80,255,120,0.3)";
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.arc(px, py, 26, Player.angle - 0.5, Player.angle + 0.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#4bd67a";
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(mx, my, mapW, mapH);
  }

  function render() {
    ctx.save();
    ctx.translate(-camera.x, -camera.y);

    drawBackground();
    drawZones();
    drawWalls();
    drawAmmoPickups();
    drawParticles();
    drawBullets();
    drawBots();
    drawPlayer();

    ctx.restore();

    drawMinimap();
    drawKillFeed();
    drawHUD();

    if (!Player.alive) {
      ctx.fillStyle = "rgba(200,30,30,0.85)";
      ctx.font = "bold 36px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("YOU DIED", canvas.width / 2, canvas.height / 2);
      ctx.font = "16px monospace";
      ctx.fillText("Respawning in " + Player.respawnTimer.toFixed(1) + "s", canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = "left";
    }
  }

  // ============================================================
  // Fixed-timestep Game Loop
  // ============================================================
  const STEP = 1 / 60;
  let accumulator = 0;
  let lastTime = performance.now();

  function update(dt) {
    gameTime += dt;
    updatePlayer(dt);
    updateWeapon(dt);
    updateBots(dt);
    updateBullets(dt);
    updateParticles(dt);
    updateAmmoPickups(dt);
    updateCamera();
  }

  function frame(now) {
    let frameDt = (now - lastTime) / 1000;
    lastTime = now;
    if (frameDt > 0.25) frameDt = 0.25; // avoid spiral of death on tab-switch

    accumulator += frameDt;
    while (accumulator >= STEP) {
      update(STEP);
      accumulator -= STEP;
    }

    render();
    requestAnimationFrame(frame);
  }

  // ============================================================
  // Level Select (SPEC.md Section 5A) — applies difficulty config,
  // (re)builds the bot roster, and only then starts the render loop.
  // ============================================================
  function startGame(levelIndex) {
    const cfg = LEVEL_CONFIGS[levelIndex];

    WEAPON = WEAPON_TABLE[cfg.weaponKey];
    BOT_DETECT_RANGE = cfg.detectRange;
    BOT_FOV_HALF = cfg.fovHalf;
    BOT_DAMAGE = cfg.damage;
    BOT_FIRE_SPREAD = cfg.fireSpread;
    BOT_BURST_COOLDOWN = cfg.burstCooldown;
    BOT_BURST_MIN = cfg.burstMin;
    BOT_BURST_MAX = cfg.burstMax;
    BOT_PAUSE_MIN = cfg.pauseMin;
    BOT_PAUSE_MAX = cfg.pauseMax;
    BOT_PERSISTENCE = cfg.persistence;
    BOT_ALERT_DURATION = cfg.alertDuration;

    bots = BOT_ROUTES.slice(0, cfg.botCount).map((wp, i) => makeBot(i, wp, cfg));
    ammoPickups = AMMO_PICKUP_CONFIG.map((p) => ({ x: p.x, y: p.y, active: true, cooldown: 0 }));
    respawnPlayer();

    document.getElementById("startScreen").style.display = "none";
    accumulator = 0;
    lastTime = performance.now();
    requestAnimationFrame(frame);
  }

  document.querySelectorAll(".level-btn").forEach((btn) => {
    btn.addEventListener("click", () => startGame(parseInt(btn.dataset.level, 10)));
  });
})();
</script>
</body>
